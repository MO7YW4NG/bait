name: B3 Customer Agent tests

on:
  push:
    branches:
      - feat/b3-customer
  pull_request:
    paths:
      - 'src/agents/customer*.ts'
      - 'tests/b3-a-compat*.ts'
      - '.github/workflows/b3-customer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck (B3 without A)
        run: pnpm check
      - name: Customer flow and payment-adapter unit tests
        run: pnpm exec tsx --test src/agents/customer.test.ts src/agents/customerPayment.test.ts

  a-compat:
    name: B3 + latest A + main (ephemeral only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and A into disposable CI worktree
        run: |
          git config user.name "Bait B3 compatibility CI"
          git config user.email "b3-ci@users.noreply.github.com"
          git fetch --no-tags origin main feat/payment-core
          git merge --no-edit --no-ff origin/main
          git merge --no-edit --no-ff origin/feat/payment-core
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --no-frozen-lockfile
      - name: Full merged TypeScript check
        run: pnpm check
      - name: Compile against actual A exported signatures
        run: pnpm exec tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --types node --skipLibCheck tests/b3-a-compat.typecheck.ts
      - name: Run customer and real-A adapter compatibility tests (no payments)
        run: pnpm exec tsx --test src/agents/customer.test.ts src/agents/customerPayment.test.ts tests/b3-a-compat.test.ts
